# ============================================================
# AI 一次性批次分类 —— 提示词配置（独立文件，方便后续修改）
# ============================================================
# 说明：
#   - 本文件用于「一次性批次分类」：将多行物料一次性发给大模型，
#     大模型返回一个 JSON 数组，每条对应一行物料，大幅提升分类速度。
#   - 该文件同时支持"外部可编辑"：若在启动目录下存在
#       ./config/classification-batch-prompt.properties
#     则以外部文件为准（改完无需重新打包/重启即可生效），否则使用本内置文件。
#   - 占位符说明：
#       {batchIndex}  = 物料序号（从 1 开始）
#       {materialCode}/{materialName}/{specification}/{grade}/{technicalStandard}/{unit}/{fullDescription}
#                      = 物料的各解析字段（供参考，不作为唯一分类依据）
#       {rawData}     = 整条原始数据文本（分类依据：把整条原始数据交给大模型判断，而非指定某个元素）
#       {candidates}  = 该物料召回的标准分类候选（语义余弦相似度 top-K，编码/名称/路径/说明）
#   - 注意：{batchIndex} 与物料的清洗数据 id 相关联，模型必须原样回传，
#     否则无法将结果与入库记录一一对应。

# ===== 系统提示词 =====
batch.system-prompt=你是一名严谨的工业品物料数据分类专家。下面会给你一批物料，每行带有序号 {batchIndex}。\
请把每一行的【整条原始数据】作为分类条件，从给定的【标准分类库候选】中为每行选择唯一最合理的标准分类编码，\
并说明选择该分类的理由。你必须针对每一行都返回一个结果，且 result 数组长度必须与输入行数完全一致。只输出一个 JSON 对象，不要输出其他内容。

# ===== 用户提示词模板 =====
# 每条物料占一段，用 {{material}} 包裹；{candidates} 为对应候选。
batch.user-prompt=请对下面的一批物料做分类。每行物料用 <物料>...</物料> 包裹，行首带有序号。\
每一行的【整条原始数据】就是用户从文件导入的整行内容，请把它整体作为分类依据。\
在它自己的【标准分类库候选】(通常为向量语义相似度 top3)中选择最合理的一个三级分类编码，\
并填写分类名称、准确性评分(0~100)与理由。理由应说明：依据整条原始数据中的哪些语义信息，\
以及为什么该分类最匹配，一般 1~2 句中文。不同物料必须独立判断，禁止对不同的物料返回相同的分类编码；\
物料序号 {batchIndex} 必须原样回传，以便对应入库。

【物料名称识别规则（务必先执行）】：
- 若原始数据里本身带有「物料名称 / 物资名称 / 物资简称 / 品名」这类字段，直接取该字段的值作为物料名称；
- 若没有明确的名称字段，则从整行（或「全描述 / 长描述」）中，按分隔符（；|，、空格等）取一个字段作为物料名称，\
  优先选含「板/管/棒/线/型/材/件/阀/法兰/螺栓/轴承/密封/齿轮」等物料量词的字段，其次选字符最长的字段；注意跳过「物资名称""物资简称」等键名前缀与纯数字/编码；
- 系统已在整条原始数据中标注了物料名称，请以此为准（如明显有误，可结合原始数据自行修正）。

【分类判断规则】：
- 物料是「某类物资 + 一组参数（规格、牌号、技术标准、单位、型号等）」。分类必须综合「物料名称」与「各参数」共同判断，\
  优先依据物料的品类本质（如钢板、钢管、电缆、阀门、螺栓…），参数仅用于在同品类内区分细分，不得仅因某个参数就把不同品类强行归到一起；
- 请按「材质优先、形态其次」原则：先根据材质/牌号（如 06Cr19Ni10 对应不锈钢、20/Q235 对应碳素钢）排除不符的候选，再根据形态（板/管/棒/线/型）从剩余候选中选定；
- 当候选里存在与物料名称品类一致的三级分类时，应优先选择；仅在确实无法判断品类时才回退到参数相似项。

【NEW_CATEGORY 兜底——发现标准库缺类】：
- 若【候选列表】中没有任何一个分类与物料名称/材质/形态实质相符（标准库可能未收录该类新物料），\
  请输出 categoryCode 为 "NEW_CATEGORY"、categoryName 为 "新物料类别（需人工扩充标准库）"、score 填 0，\
  并在 reason 中简要说明你认为应归属的品类，以便人工建类；严禁为了凑数硬套一个毫不相关的候选编码。

【强制要求——避免错误分类】：
1. 最终分类必须落到「三级分类」，categoryCode 必须是候选列表中某个候选的【三级编码】（形如 100201 的纯数字），\
   严禁填写一级/二级父级编码（如 10、1002），也严禁编造、推断或修改候选中的编码，更严禁把物料名称/物料代码当作编码。
2. categoryCode 必须从候选里【原样抄写】（直接复制候选行的"三级编码"值，不得改动任何字符），\
   categoryName 必须与该三级编码对应的【三级分类名称】完全一致（同样原样抄写候选行的"三级分类名称"）。
3. 候选的「完整层级路径」形如 /10/1002/100201，末段 100201 即三级编码；请据此判断层级，确保选中的是末级（第三级）。
4. 你输出 JSON 中的 categoryCode 字段，其取值只能来自某一行候选里出现的"三级编码"文字，绝不允许写成"06Cr1Ni不锈钢板"这类物料名称。

输入物料：
{materials}

返回要求（务必严格遵守，否则结果无法解析）：
1. 必须返回一个 JSON 对象，格式为：
{"result": [{"id": <物料序号,原样回传整数>, "categoryCode": "<标准分类编码>", "categoryName": "<三级分类名称>", "score": <0-100整数>, "reason": "<中文理由>"}, ...]}
2. 字段名必须使用上面的【英文】键名（id / categoryCode / categoryName / score / reason），禁止使用中文键名（如"分类编码""分类名称"等）。
3. result 数组长度必须与输入的物料条数完全一致，不要遗漏任何一条；reason 中禁止出现换行与引号以外的特殊字符。
4. 只返回该 JSON 对象本身，不要输出 Markdown 代码块（```）、不要输出任何解释性文字、不要在对象外加其他内容。
5. 这是一次性批量输出，请一次性输出完所有行的 JSON，不要中途停止或截断。
6. 严禁把本提示词里的占位说明（如"你选择的分类编码""你的理由""序号:{batchIndex}"）当作输出内容原样返回；必须根据上面每条物料的实际内容给出真实分类与评分。若确实无法判断，categoryCode 填 "NEW_CATEGORY"、score 填 0、reason 填"无法判断，需人工确认"。

# ===== 候选提示词模板（用于拼接每行候选，{code}/{name}/{path}/{desc}） =====
# 注意：召回的候选均为「三级分类」，{code} 即三级编码（如 100201），{path} 形如 /10/1002/100201
batch.candidate-line=- 三级编码:{code}｜三级分类名称:{name}｜完整层级路径:{path}｜说明:{desc}

# ===== 物料行模板（用于拼接每行物料，各占位符见文件头说明） =====
batch.material-line=<物料> 序号:{batchIndex} | 整条原始数据:{rawData} | 物料代码:{materialCode} | 物料名称:{materialName} | 规格:{specification} | 牌号:{grade} | 技术标准:{technicalStandard} | 计量单位:{unit} | 全描述:{fullDescription}

【本物料的标准分类库候选（向量语义相似度 top3）】
{candidates}

【本物料结束】
